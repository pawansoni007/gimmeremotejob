# Postgres for the Apply Assistant.
# Start with:  docker compose up -d
services:
  db:
    image: postgres:16
    container_name: gimmeremotejob-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: apply
      POSTGRES_PASSWORD: apply
      POSTGRES_DB: apply
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

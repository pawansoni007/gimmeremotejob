[project]
name = "gimmeremotejob-service"
version = "0.1.0"
description = "Thin FastAPI + SSE service that drives OpenHarness and streams to the Wellfound extension"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sse-starlette>=2.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    # The brain — a plain in-repo copy under ../third_party/OpenHarness (see [tool.uv.sources]).
    "openharness-ai",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.sources]
# We call OpenHarness in-process. It lives in our repo as a plain copy (not a
# submodule, not from PyPI) and is installed editable from that path.
openharness-ai = { path = "../third_party/OpenHarness", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
